<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alinhamentos com Flex</title>

    <style>
      body {
        background-color: rgb(202, 202, 202);
      }

      .container-flex, .container-flex-column {
        border: 4px solid red;
        display: flex; /* o display flex é utilizado para colocar os elementos em linha */
        flex-direction: row; /* o flex-direction: row; define a direção dos elementos em linha, nesse caso ele já vem com essa propriedade
            e column define que os elementos sejam alinhados verticalmente */
        justify-content: flex-start; /* alinha os elementos horizontalmente */
        align-items: center; /* o align-content faz com que os elementos sejam alinhados da forma que desejar em cima, só funciona com o flex-wrap*/
      }

      .container-flex > div, .container-flex-column > div {
        border: 4px solid rgb(32, 32, 32);
        color: rgb(26, 25, 25);
        padding: 4px ;
        margin: 4px;
        font-weight: bold;
        font-size: 1.5rem;
        text-align: center;
        flex-grow: 1;
      }

      .container-flex-column {
        height: 400px;
        flex-direction: column;
      }

      .item2, .item4 {
        flex: 1 1 200px; /*  o flex agrupa os elementos de flex-grow flex-shrink e flex-basis em um só comando */
      }

      .item1, .item3 {
        flex: 2 2 200px; /* o flex agrupa os elementos de flex-grow flex-shrink e flex-basis em um só comando */
      }

    </style>
  </head>
  <body>
    <h2>Row</h2>

    <div class="container-flex">
      <div class="item1">01</div>
      <div class="item2">02</div>
      <div class="item3">03</div>
      <div class="item4">04</div>
    </div>

    <h2>Column</h2>

    <div class="container-flex-column">
      <div class="item1">01</div>
      <div class="item2">02</div>
      <div class="item3">03</div>
      <div class="item4">04</div>
    </div>
  </body>
</html>
