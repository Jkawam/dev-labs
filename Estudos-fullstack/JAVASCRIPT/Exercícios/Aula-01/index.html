<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercicio aula 01</title>
  </head>
  <body>
    <script>

      const nome = prompt('Digite seu nome completo'); // O PROMPT() exibe uma caixa de diálogo modal que solicita ao usuário a entrada de texto//
      
      document.body.innerHTML += `O seu nome é ${nome} <br />`
      document.body.innerHTML += `O seu nome tem ${nome.length} letras: <br />` //O LENGTH serve para obter o tamanho de objetos iteráveis, retornando um número inteiro//
      document.body.innerHTML += `A segunda letra do seu nome é: ${nome[1]} <br />`
      document.body.innerHTML += `Qual o primeiro índice da letra a no seu nome? ${nome.indexOf('a')} <br />`// INDEXOF() serve para encontrar a primeira ocorrência de um valor específico dentro de uma String//
      document.body.innerHTML += `Qual o o ultimo índice da letra a no seu nome? ${nome.lastIndexOf('a')} <br />`//LASTINDEXOF() serve para encontrar o índice da última ocorrência de um valor especificado em uma string//
      document.body.innerHTML += `As últimas 3 letras do seu nome são: ${nome.slice(-3, nome.length)} <br />`
      document.body.innerHTML += `As palavras do seu nome são: ${nome.split('')} <br />`
      document.body.innerHTML += `Seu nome com letras maiúsculas: ${nome.toUpperCase()} <br />`
      document.body.innerHTML += `Seu nome com letras minúsculas: ${nome.toLowerCase()} <br />`
    </script>
  </body>
</html>
