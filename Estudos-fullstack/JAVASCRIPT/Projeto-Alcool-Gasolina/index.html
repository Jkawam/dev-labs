<!DOCTYPE html>

;...<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álcool ou Gasolina</title>

    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: rgb(245, 245, 245);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        section {
            padding: 1rem;
            border: 1px solid rgb(126, 126, 126);
            display: flex;
            flex-direction: column;
            width: 570px;
            border-radius: 5px;
        }

        input {
            width: 100%;
            height: 1.5rem;
            border-radius: 5px;
            border: 1px solid rgb(126, 126, 126);
        }

        .resultado {
            width: 98.4%;
            padding: 0.5rem;
            background-color: rgb(181, 213, 250);
            color: rgb(54, 92, 150);
            border-radius: 5px;
        }

        button {
            width: 20%;
            height: 2rem;
            border-radius: 5px;
            border: none;
            background-color: rgb(51, 138, 252);
            color: white;
        }
    </style>
</head>

<body>

    <section>

        <h1>É melhor utilizar Álcool ou Gasolina?</h1>

        <p>Preço do Álcool: R$</p>
        <input 
            id="alcool"
            type="number"
            step="0.01"
            placeholder="Digite o preço do Álcool ex: 4.59"
        >

        <p>Preço da Gasolina: R$</p>
        <input 
            id="gasolina"
            type="number"
            step="0.01"
            placeholder="Digite o preço da Gasolina ex: 5.99"
        >

        <p id="resultado" class="resultado">Resultado:</p>

        <button id="calcular">Calcular</button>

    </section>

    <script src="script.js"></script>

</body>

</html>
