<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Area</title>
</head>

<style>

    body{
        font-size: 2rem;
        background-color: rgb(66, 66, 66);
        color: white;
    }

    .grid{
       border: #fc0000 5px solid;
       width: 90vh;
       height: 90vh;
       row-gap: 1rem; /* espacamento entre as linhas horizontal  */
       column-gap: 1rem; /* espacamento entre as colunas vertical  */
       /*gap: 1rem; /* espacamento entre as colunas horizontal e vertical  */
       display: grid;
       grid-template-columns: repeat(3, 200px); /* o grid-template-columns serve para criar as colunas do grid e quantas colunas queremos  */
       justify-content: /*start; */ center   /*end */ /*space-between */ /*space-around */; /* alinha os itens horizontalmente usnado o start, center, end, space-between, space-around */
       align-content: /*start; */ /*center */ /*end */ space-between /*space-around */; /* alinha os itens verticalmente usnado o start, center, end, space-between, space-around */
    }

    .grid > div{
        border: 1px solid #fff;
        background-color: #333;
        padding: 2rem;
        border-radius: 0.5rem;
        text-align: center;
    }



</style>

<body>

    <div class="grid">
        <div class="item1">1</div>
        <div class="item2">2</div>
        <div class="item3">3</div>
        <div class="item4">4</div>
        <div class="item5">5</div>
        <div class="item6">6</div>
        <div class="item7">7</div>
        <div class="item8">8</div>
        <div class="item9">9</div>
        <div class="item10">10</div>
        <div class="item11">11</div>
        <div class="item12">12</div>
    </div>
    
</body>
</html>
