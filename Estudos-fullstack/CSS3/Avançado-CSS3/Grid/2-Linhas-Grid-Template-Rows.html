<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>usando linhas</title>
</head>

<style>

    body{
        font-size: 2rem;
        background-color: rgb(66, 66, 66);
        color: white;
        height: 100vh;
    }

    .grid{
       display: grid;
       grid-template-columns: repeat(3, 1fr) 2fr ; /* o grid-template-columns serve para criar as colunas do grid e quantas colunas queremos  */
       grid-template-rows: repeat(2, 1fr) 2fr ; /* o grid-template-rows serve para criar as linhas do grid e qual sera o tamanho  */
    }

    .grid > div{
        border: 1px solid #fff;
        background-color: #333;
        padding: 1rem;
        border-radius: 0.5rem;
    }

</style>

<body>

    <div class="grid">
        <div class="item1">1</div>
        <div class="item2">2</div>
        <div class="item3">3</div>
        <div class="item4">4</div>
        <div class="item5">5</div>
        <div class="item6">6</div>
        <div class="item7">7</div>
        <div class="item8">8</div>
        <div class="item9">9</div>
        <div class="item10">10</div>
        <div class="item11">11</div>
        <div class="item12">12</div>
    </div>
    
</body>
</html>
